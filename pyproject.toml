[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent"
version = "1.0.0"
description = "Real-Time Multilingual Voice AI Agent — Clinical Appointment Booking"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "httpx>=0.27.0",

    # LLM
    "anthropic>=0.28.0",
    "openai>=1.35.0",        # for embeddings (text-embedding-3-small)

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # Redis / caching
    "redis[hiredis]>=5.0.0",

    # Task queue
    "celery[redis]>=5.3.0",

    # Telephony
    "twilio>=9.0.0",
    "deepgram-sdk>=3.0.0",

    # Audio / ML
    "numpy>=1.26.0",
    "torch>=2.2.0",          # for Silero VAD (CPU-only is fine)
    "fasttext-wheel>=0.9.2", # language detection

    # Observability
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Utilities
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
